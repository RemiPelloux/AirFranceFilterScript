name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ratline:
    name: Ratline (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  flask-filter:
    name: flask-filter (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flask-filter
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: flask-filter/pyproject.toml
      # Tests use a fake browser session: no Chrome download needed.
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pip-audit --skip-editable
      - run: pytest
