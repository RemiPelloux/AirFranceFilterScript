[build-system]
requires = ["setuptools>=84.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "af-filter"
version = "2.0.0"
description = "Calendrier des tarifs les moins chers filtré sur les vols Air France / HOP."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rémi Pelloux" }]
dependencies = [
    "flask>=3.1,<4",
    "patchright>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.6,<1",
    "pip-audit>=2.7,<3",
]

[project.scripts]
af-filter = "af_filter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
af_filter = ["web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "N"]
ignore = ["RUF001", "RUF002", "RUF003"]  # French text uses typographic characters on purpose

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
