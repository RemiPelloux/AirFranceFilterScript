<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">AF Filter</title>
  <desc id="d">Un avion parcourt une route Paris–Nice au-dessus d'un calendrier dont les prix apparaissent un à un ; le meilleur tarif Air France est mis en évidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00102e"/>
      <stop offset=".55" stop-color="#002157"/>
      <stop offset="1" stop-color="#0b3478"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" x2="1">
      <stop offset="0" stop-color="#e4002b" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fff" opacity=".07"/>
    </pattern>
    <path id="route" d="M540 128 Q 712 6 892 104"/>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SF Mono", "Fira Code", Consolas, monospace; }
      .cell { opacity: 0; animation: cell 8s cubic-bezier(.22,1,.36,1) infinite; transform-box: fill-box; }
      @keyframes cell { 0%,4% { opacity: 0; transform: translateY(14px); } 12%,86% { opacity: 1; transform: none; } 96%,100% { opacity: 0; transform: translateY(-6px); } }
      .c1 { animation-delay: .10s } .c2 { animation-delay: .25s } .c3 { animation-delay: .40s }
      .c4 { animation-delay: .55s } .c5 { animation-delay: .70s } .c6 { animation-delay: .85s } .c7 { animation-delay: 1s }
      .strike { stroke-dasharray: 52; stroke-dashoffset: 52; animation: strike 8s ease-in-out infinite; }
      @keyframes strike { 0%,22% { stroke-dashoffset: 52; } 32%,90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 52; } }
      .best { opacity: 0; animation: best 8s ease-in-out infinite; }
      @keyframes best { 0%,38% { opacity: 0; } 46%,86% { opacity: 1; } 94%,100% { opacity: 0; } }
      .pulse { animation: pulse 2s ease-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3.2); opacity: 0; } }
      .dash { stroke-dasharray: 6 8; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -14; } }
      .twinkle { animation: tw 3s ease-in-out infinite; }
      @keyframes tw { 50% { opacity: .15; } }
      .chip { opacity: 0; animation: chip .6s cubic-bezier(.22,1,.36,1) forwards; }
      @keyframes chip { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .k1 { animation-delay: .2s } .k2 { animation-delay: .35s } .k3 { animation-delay: .5s } .k4 { animation-delay: .65s }
      @media (prefers-reduced-motion: reduce) {
        .cell, .best, .chip { animation: none; opacity: 1; }
        .strike { animation: none; stroke-dashoffset: 0; }
        .pulse, .dash, .twinkle { animation: none; }
        .plane { display: none; }
      }
    </style>
  </defs>

  <rect width="960" height="360" rx="22" fill="url(#bg)"/>
  <rect width="960" height="360" rx="22" fill="url(#dots)"/>
  <g fill="#fff">
    <circle class="twinkle" cx="420" cy="40" r="1.4"/>
    <circle class="twinkle" cx="610" cy="200" r="1.2" style="animation-delay:1s"/>
    <circle class="twinkle" cx="900" cy="30" r="1.6" style="animation-delay:2s"/>
    <circle class="twinkle" cx="470" cy="190" r="1" style="animation-delay:.5s"/>
  </g>

  <!-- Title block -->
  <text x="56" y="92" fill="#fff" font-size="46" font-weight="800" letter-spacing="-1">AF Filter</text>
  <text x="56" y="126" fill="#c7d2fe" font-size="17">Les tarifs les moins chers —</text>
  <text x="56" y="150" fill="#c7d2fe" font-size="17">uniquement sur les vols <tspan fill="#fff" font-weight="700">Air France</tspan> &amp; <tspan fill="#fff" font-weight="700">HOP</tspan>.</text>
  <g font-size="12" font-weight="600">
    <g class="chip k1"><rect x="56" y="170" width="74" height="24" rx="12" fill="#ffffff14" stroke="#ffffff30"/><text x="93" y="186" fill="#e0e7ff" text-anchor="middle">Python</text></g>
    <g class="chip k2"><rect x="138" y="170" width="94" height="24" rx="12" fill="#ffffff14" stroke="#ffffff30"/><text x="185" y="186" fill="#e0e7ff" text-anchor="middle">patchright</text></g>
    <g class="chip k3"><rect x="240" y="170" width="82" height="24" rx="12" fill="#ffffff14" stroke="#ffffff30"/><text x="281" y="186" fill="#e0e7ff" text-anchor="middle">GraphQL</text></g>
    <g class="chip k4"><rect x="330" y="170" width="78" height="24" rx="12" fill="#e4002b"/><text x="369" y="186" fill="#fff" text-anchor="middle">AF + A5</text></g>
  </g>

  <!-- Route -->
  <use href="#route" fill="none" stroke="#ffffff38" stroke-width="2" class="dash"/>
  <g>
    <circle cx="540" cy="128" r="5" fill="#fff"/><circle cx="540" cy="128" r="5" fill="#fff" class="pulse"/>
    <circle cx="892" cy="104" r="5" fill="#ff4d6d"/><circle cx="892" cy="104" r="5" fill="#ff4d6d" class="pulse" style="animation-delay:1s"/>
    <text x="540" y="154" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" class="mono">PAR</text>
    <text x="892" y="130" fill="#fff" font-size="13" font-weight="700" text-anchor="middle" class="mono">NCE</text>
  </g>
  <g class="plane">
    <g>
      <rect x="-46" y="-1.5" width="40" height="3" rx="1.5" fill="url(#trail)"/>
      <path d="M-9 -2 L4 -2 L12 -9 L15 -9 L10 -2 L16 -2 L19 -5 L21 -5 L19 0 L21 5 L19 5 L16 2 L10 2 L15 9 L12 9 L4 2 L-9 2 Q-12 0 -9 -2Z" fill="#fff"/>
      <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".45 0 .55 1">
        <mpath href="#route"/>
      </animateMotion>
    </g>
  </g>

  <!-- Calendar strip -->
  <g font-size="12">
    <g class="cell c1"><rect x="56" y="226" width="112" height="98" rx="12" fill="#ffffff0d" stroke="#ffffff24"/>
      <text x="112" y="250" fill="#94a3b8" text-anchor="middle">lun. 7</text>
      <text x="112" y="282" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">112 €</text>
      <text x="112" y="306" fill="#64748b" text-anchor="middle" font-size="11">toutes : 64 €</text>
      <line x1="86" y1="302" x2="138" y2="302" stroke="#ff4d6d" stroke-width="1.5" class="strike"/></g>
    <g class="cell c2"><rect x="180" y="226" width="112" height="98" rx="12" fill="#ffffff0d" stroke="#ffffff24"/>
      <text x="236" y="250" fill="#94a3b8" text-anchor="middle">mar. 8</text>
      <text x="236" y="282" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">98 €</text>
      <text x="236" y="306" fill="#64748b" text-anchor="middle" font-size="11">toutes : 59 €</text>
      <line x1="210" y1="302" x2="262" y2="302" stroke="#ff4d6d" stroke-width="1.5" class="strike" style="animation-delay:.15s"/></g>
    <g class="cell c3"><rect x="304" y="226" width="112" height="98" rx="12" fill="#ffffff0d" stroke="#ffffff24"/>
      <text x="360" y="250" fill="#94a3b8" text-anchor="middle">mer. 9</text>
      <text x="360" y="282" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">104 €</text>
      <text x="360" y="306" fill="#64748b" text-anchor="middle" font-size="11">toutes : 71 €</text>
      <line x1="334" y1="302" x2="386" y2="302" stroke="#ff4d6d" stroke-width="1.5" class="strike" style="animation-delay:.3s"/></g>
    <g class="cell c4"><rect x="428" y="226" width="112" height="98" rx="12" fill="#ffffff0d" stroke="#ffffff24"/>
      <text x="484" y="250" fill="#94a3b8" text-anchor="middle">jeu. 10</text>
      <text x="484" y="282" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">89 €</text>
      <text x="484" y="306" fill="#64748b" text-anchor="middle" font-size="11">toutes : 61 €</text>
      <line x1="458" y1="302" x2="510" y2="302" stroke="#ff4d6d" stroke-width="1.5" class="strike" style="animation-delay:.45s"/></g>
    <g class="cell c5">
      <rect x="552" y="226" width="112" height="98" rx="12" fill="#ffffff0d" stroke="#ffffff24"/>
      <g class="best">
        <rect x="552" y="226" width="112" height="98" rx="12" fill="#22c55e1f" stroke="#22c55e" stroke-width="2"/>
        <rect x="574" y="215" width="68" height="20" rx="10" fill="#22c55e"/>
        <text x="608" y="229" fill="#052e16" font-size="10" font-weight="800" text-anchor="middle">MEILLEUR</text>
      </g>
      <text x="608" y="250" fill="#94a3b8" text-anchor="middle">ven. 11</text>
      <text x="608" y="282" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">76 €</text>
      <text x="608" y="306" fill="#64748b" text-anchor="middle" font-size="11">toutes : 58 €</text>
      <line x1="582" y1="302" x2="634" y2="302" stroke="#ff4d6d" stroke-width="1.5" class="strike" style="animation-delay:.6s"/></g>
    <g class="cell c6"><rect x="676" y="226" width="112" height="98" rx="12" fill="#ffffff0d" stroke="#ffffff24"/>
      <text x="732" y="250" fill="#94a3b8" text-anchor="middle">sam. 12</text>
      <text x="732" y="282" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">131 €</text>
      <text x="732" y="306" fill="#64748b" text-anchor="middle" font-size="11">toutes : 77 €</text>
      <line x1="706" y1="302" x2="758" y2="302" stroke="#ff4d6d" stroke-width="1.5" class="strike" style="animation-delay:.75s"/></g>
    <g class="cell c7"><rect x="800" y="226" width="112" height="98" rx="12" fill="#ffffff0d" stroke="#ffffff24"/>
      <text x="856" y="250" fill="#94a3b8" text-anchor="middle">dim. 13</text>
      <text x="856" y="282" fill="#fff" font-size="24" font-weight="800" text-anchor="middle">94 €</text>
      <text x="856" y="306" fill="#64748b" text-anchor="middle" font-size="11">toutes : 66 €</text>
      <line x1="830" y1="302" x2="882" y2="302" stroke="#ff4d6d" stroke-width="1.5" class="strike" style="animation-delay:.9s"/></g>
  </g>
</svg>
